services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ragproj-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      # Host 5433 so a locally installed PostgreSQL on 5432 does not conflict.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied only when the volume is first created: `docker compose down -v`
      # then `up` is how you pick up schema changes.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
