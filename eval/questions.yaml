# Evaluation question set.
#
# expected_source_ids are the chunks retrieval SHOULD return; recall@5 and MRR
# are computed against them. They are written by hand and must be checked
# against the ingested data before any result is reported -- ATT&CK renames and
# re-numbers things between versions (v19 replaced the Defense Evasion tactic
# with Stealth and Defense Impairment, for instance). Every ID below was checked
# against ATT&CK v19.2 and KEV catalog 2026.10.08: live, and with the
# relationship lists (mitigated_by) read from the bundle, not from memory.
#
# Questions were written before looking at any retrieval output, so they are not
# tuned to what the system already gets right. Keep it that way when adding more.
#
# Conventions:
#   - A question about a sub-technique expects that sub-technique only; the
#     parent is added only when the question is general enough to mean both.
#   - `needs` records which doc_types must be ingested for a question to be
#     answerable at all; questions whose needs are missing are skipped.
#   - `platform` / `doc_type`, when present, are passed to retrieval as filters.
#   - recall@5 is capped at 5/n when a question expects n > 5 IDs.
#
# Categories: id_lookup, conceptual, relational, vulnerability, entity,
# revoked_id, unanswerable.

